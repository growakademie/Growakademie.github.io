<style>
:root{
  color-scheme:light;
  --navy:#0B2644;
  --navy-deep:#071A30;
  --aqua:#8FD0D8;
  --mist:#D3E9EC;
  --blue:#4C86B9;
  --white:#FFFFFF;
  --ink:#0B2644;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',system-ui,sans-serif;
  color:var(--ink);background:var(--white);
  line-height:1.7;font-size:17px;
  -webkit-text-size-adjust:100%;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.wrap{width:min(1080px,100% - 60px);margin-inline:auto}

/* NAV */
header{position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white)}
.nav{display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700}
.brand img{width:44px;height:44px;border-radius:50%}
.nav-links{display:none;gap:26px;font-weight:600;font-size:15px}
.nav-links a{text-decoration:none;color:var(--mist)}
.nav-links a:hover{color:var(--white)}
.lang{
  font:inherit;font-weight:700;font-size:14px;cursor:pointer;
  background:transparent;color:var(--aqua);
  border:1.5px solid var(--aqua);border-radius:999px;padding:4px 16px;
}
.lang:hover{background:var(--aqua);color:var(--navy)}
@media(min-width:820px){.nav-links{display:flex}}

/* HERO */
.hero{background:var(--navy);color:var(--white);padding-block:56px 80px;overflow:hidden;position:relative}
.hero .wrap{display:grid;gap:40px;align-items:center}
.hero h1{
  font-weight:900;line-height:1.08;letter-spacing:-0.02em;
  font-size:clamp(34px,7.5vw,68px);
}
.hero h1 span{display:block;color:var(--aqua)}
html[lang=ar] .hero h1{letter-spacing:0;line-height:1.25}
.hero p.lead{margin-top:22px;max-width:34em;color:var(--mist);font-size:clamp(17px,2.4vw,20px)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;
  border:2px solid transparent;font-size:16px;
}
.btn-primary{background:var(--aqua);color:var(--navy)}
.btn-primary:hover{background:var(--white)}
.btn-ghost{border-color:var(--aqua);color:var(--aqua)}
.btn-ghost:hover{background:var(--aqua);color:var(--navy)}
.sprout{width:min(260px,54vw);justify-self:center;color:var(--aqua)}
.sprout .draw{stroke-dasharray:420;stroke-dashoffset:0}
.sprout .leaf{transform-box:fill-box;transform-origin:50% 100%}
.sprout.armed .draw{stroke-dashoffset:420}
.sprout.armed .leaf{opacity:0}
.sprout.armed.go .draw{animation:grow 2.2s ease-out forwards}
.sprout.armed.go .leaf{animation:leaf 1s 1.5s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes leaf{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){
  .sprout.armed .draw{animation:none!important;stroke-dashoffset:0!important}
  .sprout.armed .leaf{animation:none!important;opacity:1!important}
  html{scroll-behavior:auto}
}
@media(min-width:820px){.hero .wrap{grid-template-columns:1.5fr 1fr}}

/* SECTIONS */
section{position:relative;padding-block:72px}
section[data-from]::before{content:"";position:absolute;inset-inline:0;top:0;height:72px;background:linear-gradient(to bottom,var(--from),transparent);pointer-events:none}
h2{font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.2;letter-spacing:-0.01em}
html[lang=ar] h2{letter-spacing:0;line-height:1.35}
.sub{margin-top:12px;max-width:36em;color:#3b5671}

/* ABOUT */
#about{background:var(--mist)}
#about .wrap{max-width:760px}
#about p{margin-top:18px;font-size:19px}

/* COURSES */
#courses{background:var(--white)}
.courses{display:grid;gap:20px;margin-top:36px}
.course{padding:34px 30px;border-radius:28px}
.course h3{font-size:26px;font-weight:900;line-height:1.3}
.course p{margin-top:10px}
.course.online{background:var(--navy);color:var(--white)}
.course.online p{color:var(--mist)}
.course.onsite{background:var(--aqua);color:var(--navy)}
.course .btn{margin-top:22px;padding:10px 22px;font-size:15px}
.course.online .btn{background:var(--aqua);color:var(--navy)}
.course.onsite .btn{background:var(--navy);color:var(--white)}
@media(min-width:760px){.courses{grid-template-columns:1fr 1fr}}

/* SERVICES */
#services{background:var(--navy);color:var(--white)}
#services .sub{color:var(--mist)}
.rows{margin-top:36px;border-top:1px solid rgba(143,208,216,.35)}
.row{
  display:grid;gap:6px;padding-block:26px;
  border-bottom:1px solid rgba(143,208,216,.35);
}
.row h3{font-size:24px;font-weight:700;color:var(--aqua);line-height:1.3}
.row p{color:var(--mist);max-width:38em}
@media(min-width:760px){.row{grid-template-columns:1fr 1.4fr;gap:32px;align-items:baseline}}

/* EVENTS */
#events{background:var(--white)}
#events .box{
  background:var(--mist);border-radius:28px;padding:40px 30px;
  display:grid;gap:22px;align-items:center;
}
#events p{max-width:34em}
@media(min-width:760px){#events .box{grid-template-columns:1.6fr 1fr;padding:48px}
  #events .box .btn{justify-self:end}}
#events .btn{background:var(--navy);color:var(--white)}
#events .btn:hover{background:var(--blue)}

/* CONTACT */
#contact{background:var(--navy-deep);color:var(--white)}
#contact .sub{color:var(--mist)}
.contact-grid{display:grid;gap:28px;margin-top:36px}
.contact-list{display:grid;gap:18px}
.contact-list dt{font-size:14px;color:var(--aqua);font-weight:600}
.contact-list dd{font-size:20px;font-weight:700}
.contact-list a{text-decoration:none;border-bottom:2px solid rgba(143,208,216,.4)}
.contact-list a:hover{border-color:var(--aqua)}
.bdi{unicode-bidi:isolate;direction:ltr;display:inline-block}
@media(min-width:760px){.contact-grid{grid-template-columns:1fr 1fr;align-items:start}}

footer{background:var(--navy-deep);color:var(--mist);padding-block:26px;font-size:14px;border-top:1px solid rgba(143,208,216,.2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
footer img{width:34px;height:34px;border-radius:50%}
footer .f{display:flex;align-items:center;gap:10px}

/* floating whatsapp */
.wa{
  position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:20;
  background:#25D366;color:#073b1d;width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.wa svg{width:30px;height:30px}

/* chips, service bodies, events buttons */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chips span{padding:6px 16px;border-radius:999px;font-weight:700;font-size:15px;line-height:1.5}
.chips .ltr{direction:ltr;unicode-bidi:isolate}
.feats{margin-top:26px}
.feats span{background:var(--mist);color:var(--navy)}
.row .body{display:grid;gap:12px;justify-items:start}
.row .chips{margin-top:0}
.row .chips span{border:1.5px solid var(--aqua);color:var(--aqua)}
.row .btn{margin-top:8px;padding:10px 24px;font-size:15px}
@media(min-width:760px){.row{align-items:start}}
.btns{display:flex;flex-wrap:wrap;gap:12px}
@media(min-width:760px){.btns{flex-direction:column;justify-self:end}}
#events .btn.btn-line{background:transparent;color:var(--navy);border-color:var(--navy)}
#events .btn.btn-line:hover{background:var(--navy);color:var(--white)}
.contact-list a{overflow-wrap:anywhere}

/* TREE: grows with scroll */
.tree{position:fixed;inset-inline-start:3px;top:84px;bottom:24px;width:24px;z-index:5;pointer-events:none;color:var(--blue);transition:color .7s ease}
.tree.on-dark{color:var(--aqua)}
.tree.on-light{color:var(--navy)}
.tree svg{display:block;width:24px;height:100%;overflow:visible}
.tree .stem{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.tree .lf{fill:currentColor;opacity:0;transform:scale(.2);transform-box:fill-box;transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.5,.4,1)}
.tree .lf.r{transform-origin:0% 100%}
.tree .lf.l{transform-origin:100% 100%}
.tree .lf.on{opacity:.95;transform:scale(1)}
.tree .crown{fill:currentColor;opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:50% 100%;transition:opacity .6s ease,transform .9s cubic-bezier(.2,1.5,.4,1)}
.tree.done .crown{opacity:1;transform:scale(1);filter:drop-shadow(0 0 5px currentColor)}
@media(prefers-reduced-motion:reduce){.tree,.tree *{transition:none!important}}
</style>
</head>
<body>
<div class="tree" id="tree" aria-hidden="true"></div>

    es.forEach(e=>sp.classList.toggle("go",e.isIntersecting&&e.intersectionRatio>=0.4));
  },{threshold:[0,0.4,1]}).observe(sp);
}

/* ===== Growing tree + tone ===== */
const tree=document.getElementById("tree");
const tones=[...document.querySelectorAll("[data-tone]")];
let stem=null,leaves=[];
function buildTree(){
  const H=Math.max(200,tree.clientHeight), top=28, bottom=H-2, len=bottom-top;
  const n=Math.max(4,Math.round(len/85));
  let s='<svg viewBox="0 0 24 '+H+'" aria-hidden="true"><path class="stem" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M12 '+bottom+' L12 '+top+'"/>';
  for(let i=1;i<=n;i++){
    const f=i/(n+1), y=(bottom-len*f).toFixed(1), r=i%2===1;
    s+=r?'<path class="lf r" data-f="'+f+'" d="M12 '+y+' C12 '+(y-8)+' 16 '+(y-14)+' 23 '+(y-15)+' C23 '+(y-8)+' 19 '+(y-1)+' 12 '+y+' Z"/>'
        :'<path class="lf l" data-f="'+f+'" d="M12 '+y+' C12 '+(y-8)+' 8 '+(y-14)+' 1 '+(y-15)+' C1 '+(y-8)+' 5 '+(y-1)+' 12 '+y+' Z"/>';
  }
  s+='<path class="crown" d="M12 '+(top+2)+' C5 '+(top-6)+' 5 '+(top-16)+' 12 '+(top-24)+' C19 '+(top-16)+' 19 '+(top-6)+' 12 '+(top+2)+' Z"/></svg>';
  tree.innerHTML=s;
  stem=tree.querySelector(".stem"); leaves=[...tree.querySelectorAll(".lf")];
  update();
}
function update(){
  if(!stem) return;
  const max=document.documentElement.scrollHeight-innerHeight;
  const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  stem.style.strokeDashoffset=(1-Math.max(p,0.02)).toFixed(4);
  leaves.forEach(l=>l.classList.toggle("on",p>=parseFloat(l.dataset.f)));
  tree.classList.toggle("done",p>0.985);
  const y=innerHeight*0.5; let tone="dark";
  for(const el of tones){const r=el.getBoundingClientRect(); if(r.top<=y&&r.bottom>y){tone=el.dataset.tone;break;}}
  tree.classList.toggle("on-dark",tone==="dark");
  tree.classList.toggle("on-light",tone==="light");
}
let tick=false;
addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(()=>{update();tick=false;});}},{passive:true});
addEventListener("resize",buildTree);
buildTree();
</script>
